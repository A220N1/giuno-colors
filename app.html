<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Coloriage</title>
<style>
:root {
  --bg: #f6f4ef;
  --ink: #3a3a3a;
  --muted: #8a8a8a;
  --line: #6b6b6b;
  --hl: #d0d0d0;
  --accent: #3d7be0;
  --good: #3fa34d;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

#gallery { display: block; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
#gallery h1 { font-size: 24px; font-weight: 650; margin: 4px 0 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.card:active { transform: scale(.98); }
.thumb { width: 100%; height: auto; display: block; border-radius: 8px; background: #fff; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.meta b { font-size: 16px; font-weight: 600; }
.meta span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { height: 6px; background: #ececec; border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.bar.full > i { background: var(--good); }
.note { font-size: 13px; color: var(--muted); margin: 20px 0 0; }

#play { background: #fff; }
.top { display: flex; align-items: center; gap: 6px; padding: calc(4px + env(safe-area-inset-top)) 6px 4px; border-bottom: 1px solid #eee; }
.top .bar { flex: 1; height: 8px; margin: 0 6px; }
.icon { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; flex: none; }
.icon:active { background: #eee; }
.icon svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#stage { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #fff; }
#stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #eee; background: #fafafa; }
.swatch { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; font-weight: 700; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .14); transition: transform .12s; }
.swatch .count { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--ink); font-size: 12px; font-style: normal; font-weight: 700; line-height: 20px; text-align: center; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .18); }
.swatch.done .count { display: none; }
#find.hint { animation: beckon 1.1s ease-in-out infinite; }
@keyframes beckon { 0%, 100% { background: transparent; transform: scale(1); } 50% { background: #ffe08a; transform: scale(1.15); } }
.swatch svg { display: none; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.swatch.sel { transform: scale(1.12); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ink); }
.swatch.done { opacity: .35; }
.swatch.done span { display: none; }
.swatch.done svg { display: block; }
.swatch.hint { animation: wiggle .5s ease-in-out; }
@keyframes wiggle { 20% { transform: rotate(-14deg) scale(1.1); } 50% { transform: rotate(12deg) scale(1.1); } 80% { transform: rotate(-6deg); } }

.art [data-c] {
  fill: #fff !important;
  stroke: var(--line) !important;
  stroke-width: 1.6px !important;
  vector-effect: non-scaling-stroke;
  pointer-events: visiblePainted;
  transition: fill .2s;
}
.art [data-c].hl { fill: var(--hl) !important; }
.art [data-c].done { fill: var(--c) !important; stroke: var(--c) !important; }
.art, .art * { pointer-events: none; }
.art [data-c] { pointer-events: visiblePainted; }
.thumb .art [data-c] { stroke-width: .7px !important; }
.labels text { font-family: system-ui, sans-serif; font-weight: 600; fill: #4a4a4a; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.labels text.off { display: none; }
.marks { pointer-events: none; }
.ring { fill: none; stroke: #ff3b6b; stroke-width: 4px; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: ring .6s ease-out 3; }
@keyframes ring { from { transform: scale(1.8); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); opacity: 1; } }

.bravo { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #fff; border-radius: 20px; box-shadow: 0 4px 18px rgba(0, 0, 0, .18); padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
.bravo p { margin: 0; font-size: 26px; font-weight: 700; }
.pill { background: var(--accent); color: #fff; border-radius: 22px; padding: 11px 18px; font-size: 16px; font-weight: 600; }
.pill.danger { background: #d9453b; }
.pill.plain { background: #eee; color: var(--ink); }
#confetti { position: fixed; inset: 0; pointer-events: none; width: 100%; height: 100%; }
.dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); display: grid; place-items: center; padding: 16px; }
.dialog > div { background: #fff; border-radius: 18px; padding: 20px; max-width: 340px; display: grid; gap: 18px; }
.dialog p { margin: 0; font-size: 18px; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<section id="gallery" class="screen">
  <h1>Coloriages</h1>
  <div id="cards" class="cards"></div>
  <p id="storage-note" class="note" hidden>Ce navigateur ne garde pas la progression : elle sera perdue en fermant la page.</p>
  <p class="note">Version __BUILD__</p>
</section>

<section id="play" class="screen" hidden>
  <div class="top">
    <button id="back" class="icon" aria-label="Retour aux dessins"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="progress" class="bar"><i></i></div>
    <button id="find" class="icon" aria-label="Trouver une zone"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    <button id="reset" class="icon" aria-label="Recommencer"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 3.5v3.5h3.5"/></svg></button>
  </div>
  <div id="stage">
    <div id="bravo" class="bravo" hidden><p>Bravo&nbsp;!</p><button id="bravo-back" class="pill">Autres dessins</button></div>
  </div>
  <div id="palette" class="palette"></div>
</section>

<div id="confirm" class="dialog" hidden>
  <div>
    <p>Tout effacer et recommencer ce dessin ?</p>
    <div class="row"><button id="confirm-no" class="pill plain">Annuler</button><button id="confirm-yes" class="pill danger">Effacer</button></div>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script type="application/json" id="drawings">__DRAWINGS__</script>
<script>
'use strict';

const NS = 'http://www.w3.org/2000/svg';
const LEVELS = ['', 'Facile', 'Moyen', 'Difficile'];
const LABEL_MIN_PX = 9;   // numbers smaller than this on screen are hidden until zoomed in
const TAP_SLOP_PX = 10;   // finger movement still counted as a tap
const TAP_REACH_PX = 16;  // a near miss still fills a matching zone this close
const MAX_ZOOM = 10;      // relative to the fitted view
const LONG_PRESS_MS = 450; // holding a zone this long picks its colour
const FINDABLE_PX = 6;    // a zone narrower than this on screen is hard to spot: the magnifier beckons
const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const $ = (sel) => document.querySelector(sel);
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const fmt = (v) => String(Math.round(v * 10) / 10);

function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function makeStore() {
  const prefix = 'coloriage.v1.';
  const mem = new Map();
  let ok = false;
  try {
    localStorage.setItem(prefix + 'probe', '1');
    ok = localStorage.getItem(prefix + 'probe') === '1';
    localStorage.removeItem(prefix + 'probe');
  } catch (e) { ok = false; }
  return {
    ok,
    get(key) {
      if (mem.has(key)) return mem.get(key);
      let v = [];
      if (ok) {
        try { v = JSON.parse(localStorage.getItem(prefix + key) || '[]'); } catch (e) { v = []; }
      }
      if (!Array.isArray(v)) v = [];
      mem.set(key, v);
      return v;
    },
    set(key, list) {
      mem.set(key, list);
      if (ok) {
        try { localStorage.setItem(prefix + key, JSON.stringify(list)); } catch (e) { /* quota or private mode */ }
      }
    },
  };
}

function parseDrawing(entry) {
  try {
    const doc = new DOMParser().parseFromString(entry.svg, 'image/svg+xml');
    const root = doc.documentElement;
    if (root.localName !== 'svg') throw new Error('not an svg');
    return {
      id: entry.id,
      key: entry.id + '.' + entry.hash,  // a changed drawing starts over instead of mixing up zones
      title: root.getAttribute('data-title') || entry.id,
      level: parseInt(root.getAttribute('data-level'), 10) || 1,
      vb: root.getAttribute('viewBox').trim().split(/[\s,]+/).map(Number),
      palette: root.getAttribute('data-palette').trim().split(/[\s,]+/),
      root,
    };
  } catch (e) {
    console.error('drawing ' + entry.id + ' skipped:', e);
    return null;
  }
}

function instantiate(d) {
  const g = svgEl('g', { class: 'art' });
  for (const child of d.root.childNodes) g.append(document.importNode(child, true));
  const zones = [...g.querySelectorAll('[data-c]')];
  const colors = zones.map((z) => parseInt(z.getAttribute('data-c'), 10) - 1);
  return { g, zones, colors };
}

function paint(zone, color) {
  zone.classList.remove('hl');
  zone.classList.add('done');
  zone.style.setProperty('--c', color);
}

function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  return lum > 150 ? '#333' : '#fff';
}

// Geometry of a shape element as path data, for canvas rendering.
function shapePath(el) {
  const n = (name) => parseFloat(el.getAttribute(name)) || 0;
  switch (el.localName) {
    case 'path': return el.getAttribute('d');
    case 'rect': return `M${n('x')} ${n('y')}h${n('width')}v${n('height')}h${-n('width')}z`;
    case 'circle': {
      const cx = n('cx'), cy = n('cy'), r = n('r');
      return `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`;
    }
    case 'ellipse': {
      const cx = n('cx'), cy = n('cy'), rx = n('rx'), ry = n('ry');
      return `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0z`;
    }
    case 'polygon': return 'M' + el.getAttribute('points').trim() + 'z';
    case 'polyline': return 'M' + el.getAttribute('points').trim();
    case 'line': return `M${n('x1')} ${n('y1')}L${n('x2')} ${n('y2')}`;
    default: return null;
  }
}

const idCheck = (id) => (id * 151 + 89) & 255;

// Rasterize the drawing with one colour per zone, then find for each zone the visible point
// farthest from its edges: that is where its number fits best. The map also serves near-miss taps.
function analyse(d, art, zones) {
  const [vx, vy, vw, vh] = d.vb;
  const k = 640 / Math.max(vw, vh);
  const W = Math.ceil(vw * k), H = Math.ceil(vh * k);
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const base = new DOMMatrix([k, 0, 0, k, -vx * k, -vy * k]);
  const toArt = art.getCTM().inverse();
  const n = zones.length;
  for (const node of art.querySelectorAll('*')) {
    if (node.closest('defs, clipPath, mask, pattern, symbol')) continue;
    const geom = shapePath(node);
    const ctm = geom && node.getCTM();
    if (!ctm) continue;
    ctx.setTransform(base.multiply(toArt.multiply(ctm)));
    const path = new Path2D(geom);
    const cs = getComputedStyle(node);
    const rule = cs.fillRule === 'evenodd' ? 'evenodd' : 'nonzero';
    if (node.hasAttribute('data-c')) {
      const id = parseInt(node.getAttribute('data-i'), 10) + 1;
      ctx.fillStyle = `rgb(${id & 255},${(id >> 8) & 255},${idCheck(id)})`;
      ctx.fill(path, rule);
    } else if (cs.display !== 'none' && cs.visibility !== 'hidden') {
      // decorations hide what is under them but belong to no zone
      ctx.fillStyle = ctx.strokeStyle = 'rgb(0,0,1)';
      if (cs.fill !== 'none') ctx.fill(path, rule);
      const sw = parseFloat(cs.strokeWidth);
      if (cs.stroke !== 'none' && sw > 0) {
        ctx.lineWidth = sw;
        ctx.lineCap = cs.strokeLinecap || 'butt';
        ctx.lineJoin = cs.strokeLinejoin || 'miter';
        ctx.stroke(path);
      }
    }
  }
  const px = ctx.getImageData(0, 0, W, H).data;
  const lab = new Uint16Array(W * H);
  for (let p = 0, q = 0; p < lab.length; p++, q += 4) {
    if (px[q + 3] !== 255) continue;
    const id = px[q] | (px[q + 1] << 8);
    // antialiased edges blend two ids; the check byte rejects most of those
    if (id > 0 && id <= n && px[q + 2] === idCheck(id)) lab[p] = id;
  }

  // chamfer 3-4 distance to the nearest pixel of another zone
  const dist = new Float32Array(W * H);
  for (let p = 0; p < dist.length; p++) dist[p] = lab[p] ? 1e9 : 0;
  const near = (x, y, L) => (x < 0 || y < 0 || x >= W || y >= H || lab[y * W + x] !== L) ? 0 : dist[y * W + x];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = y * W + x, L = lab[p];
      if (!L) continue;
      dist[p] = Math.min(dist[p], near(x - 1, y, L) + 3, near(x - 1, y - 1, L) + 4,
        near(x, y - 1, L) + 3, near(x + 1, y - 1, L) + 4);
    }
  }
  for (let y = H - 1; y >= 0; y--) {
    for (let x = W - 1; x >= 0; x--) {
      const p = y * W + x, L = lab[p];
      if (!L) continue;
      dist[p] = Math.min(dist[p], near(x + 1, y, L) + 3, near(x + 1, y + 1, L) + 4,
        near(x, y + 1, L) + 3, near(x - 1, y + 1, L) + 4);
    }
  }
  const best = new Float32Array(n + 1);
  const at = new Int32Array(n + 1).fill(-1);
  for (let p = 0; p < lab.length; p++) {
    const L = lab[p];
    if (L && dist[p] > best[L]) { best[L] = dist[p]; at[L] = p; }
  }
  const pos = zones.map((z, i) => {
    const p = at[i + 1];
    if (p >= 0) return { x: vx + ((p % W) + 0.5) / k, y: vy + (Math.floor(p / W) + 0.5) / k, r: best[i + 1] / 3 / k };
    const b = z.getBBox();  // too small or hidden for the raster
    return { x: b.x + b.width / 2, y: b.y + b.height / 2, r: Math.max(1, Math.min(b.width, b.height) / 2) };
  });
  return { k, W, H, lab, pos };
}

const store = makeStore();
const drawings = JSON.parse($('#drawings').textContent).map(parseDrawing).filter(Boolean);
const stage = $('#stage');
let P = null;           // the drawing being coloured
let fromGallery = false;

function showGallery() {
  P = null;
  stopConfetti();
  $('#find').classList.remove('hint');
  $('#play').hidden = true;
  $('#gallery').hidden = false;
  const list = $('#cards');
  list.replaceChildren();
  for (const d of drawings) {
    const { g, zones, colors } = instantiate(d);
    const filled = new Set(store.get(d.key).filter((i) => i < zones.length));
    zones.forEach((z, i) => { if (filled.has(i)) paint(z, d.palette[colors[i]]); });
    const thumb = svgEl('svg', { viewBox: d.vb.join(' '), class: 'thumb' });
    thumb.style.aspectRatio = `${d.vb[2]} / ${d.vb[3]}`;
    thumb.append(g);
    const card = document.createElement('button');
    card.className = 'card';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const title = document.createElement('b');
    title.textContent = d.title;
    const info = document.createElement('span');
    info.textContent = `${LEVELS[d.level] || ''} · ${zones.length}`;
    meta.append(title, info);
    const bar = document.createElement('div');
    bar.className = 'bar' + (filled.size === zones.length ? ' full' : '');
    const fill = document.createElement('i');
    fill.style.width = (100 * filled.size / zones.length) + '%';
    bar.append(fill);
    card.append(thumb, meta, bar);
    card.addEventListener('click', () => { fromGallery = true; location.hash = encodeURIComponent(d.id); });
    list.append(card);
  }
  $('#storage-note').hidden = store.ok;
}

function openDrawing(d) {
  stopConfetti();
  $('#gallery').hidden = true;
  $('#play').hidden = false;
  $('#bravo').hidden = true;
  const svg = svgEl('svg');
  const world = svgEl('g');
  const { g, zones, colors } = instantiate(d);
  const labels = svgEl('g', { class: 'labels' });
  const marks = svgEl('g', { class: 'marks' });
  world.append(g, labels, marks);
  svg.append(world);
  stage.querySelector(':scope > svg')?.remove();
  stage.prepend(svg);
  P = {
    d, svg, world, art: g, zones, colors, labels, marks,
    filled: new Set(store.get(d.key).filter((i) => i < zones.length)),
    sel: -1, s: 1, tx: 0, ty: 0, fit: 1, W: 0, H: 0, left0: 0, top0: 0, anim: 0,
  };
  zones.forEach((z, i) => {
    z.setAttribute('data-i', i);
    if (P.filled.has(i)) paint(z, d.palette[colors[i]]);
  });
  buildPalette();  // before measuring: its rows take height from the drawing area
  measureStage();
  fitView();
  P.info = analyse(d, g, zones);
  buildLabels();
  updateProgress();
  const first = nextColor(-1);
  if (first >= 0) selectColor(first); else finish(false);
}

function measureStage() {
  const r = stage.getBoundingClientRect();
  P.W = r.width; P.H = r.height; P.left0 = r.left; P.top0 = r.top;
}

function fitView() {
  const [vx, vy, vw, vh] = P.d.vb;
  P.fit = Math.min(P.W / vw, P.H / vh) * 0.96;
  P.s = 0;
  setView(P.fit, (P.W - vw * P.fit) / 2 - vx * P.fit, (P.H - vh * P.fit) / 2 - vy * P.fit);
}

function setView(s, tx, ty) {
  const [vx, vy, vw, vh] = P.d.vb;
  s = clamp(s, P.fit, P.fit * MAX_ZOOM);
  // keep the middle of the screen over the drawing, centre it when it is smaller than the screen
  tx = vw * s <= P.W ? (P.W - vw * s) / 2 - vx * s : clamp(tx, P.W / 2 - (vx + vw) * s, P.W / 2 - vx * s);
  ty = vh * s <= P.H ? (P.H - vh * s) / 2 - vy * s : clamp(ty, P.H / 2 - (vy + vh) * s, P.H / 2 - vy * s);
  const zoomed = s !== P.s;
  P.s = s; P.tx = tx; P.ty = ty;
  P.world.setAttribute('transform', `matrix(${s} 0 0 ${s} ${tx} ${ty})`);
  if (zoomed) updateLabelVisibility();
  scheduleFindHint();
}

let hintRaf = 0;
function scheduleFindHint() {
  if (!hintRaf) hintRaf = requestAnimationFrame(updateFindHint);
}

// The magnifier beckons when no zone left in the chosen colour can be seen on screen.
function updateFindHint() {
  hintRaf = 0;
  if (!P || !P.info) return;
  let need = P.sel >= 0;
  for (let i = 0; need && i < P.zones.length; i++) {
    if (P.filled.has(i) || P.colors[i] !== P.sel) continue;
    const p = P.info.pos[i];
    const sx = P.tx + p.x * P.s, sy = P.ty + p.y * P.s;
    if (p.r * P.s >= FINDABLE_PX && sx >= 0 && sy >= 0 && sx <= P.W && sy <= P.H) need = false;
  }
  $('#find').classList.toggle('hint', need);
}

function buildLabels() {
  P.labels.replaceChildren();
  P.labelEls = new Array(P.zones.length).fill(null);
  const maxFs = Math.max(P.d.vb[2], P.d.vb[3]) * 0.055;
  P.zones.forEach((z, i) => {
    if (P.filled.has(i)) return;
    const { x, y, r } = P.info.pos[i];
    const num = String(P.colors[i] + 1);
    const fs = Math.min(maxFs, r * (num.length > 1 ? 0.95 : 1.25));
    const t = svgEl('text', { x: fmt(x), y: fmt(y), 'font-size': fmt(fs) });
    t.textContent = num;
    P.labels.append(t);
    P.labelEls[i] = { el: t, fs };
  });
  updateLabelVisibility();
}

function updateLabelVisibility() {
  if (!P.labelEls) return;
  for (const l of P.labelEls) if (l) l.el.classList.toggle('off', l.fs * P.s < LABEL_MIN_PX);
}

function buildPalette() {
  const pal = $('#palette');
  pal.replaceChildren();
  P.left = P.d.palette.map(() => 0);
  const used = P.d.palette.map(() => 0);
  P.colors.forEach((c, i) => { used[c]++; if (!P.filled.has(i)) P.left[c]++; });
  P.swatches = P.d.palette.map((color, ci) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (P.left[ci] === 0 ? ' done' : '');
    b.hidden = used[ci] === 0;
    b.style.background = color;
    b.style.color = inkFor(color);
    b.innerHTML = `<span>${ci + 1}</span>${CHECK_SVG}<i class="count">${P.left[ci]}</i>`;
    b.addEventListener('click', () => { if (P.left[ci] > 0) selectColor(ci); });
    b.addEventListener('animationend', () => b.classList.remove('hint'));
    pal.append(b);
    return b;
  });
}

function updateCount(ci) {
  P.swatches[ci].querySelector('.count').textContent = P.left[ci];
}

function nextColor(from) {
  const n = P.d.palette.length;
  for (let j = 1; j <= n; j++) {
    const c = (from + j + n) % n;
    if (P.left[c] > 0) return c;
  }
  return -1;
}

function selectColor(ci) {
  P.sel = ci;
  P.swatches.forEach((b, j) => b.classList.toggle('sel', j === ci));
  P.zones.forEach((z, i) => z.classList.toggle('hl', P.colors[i] === ci && !P.filled.has(i)));
  scheduleFindHint();
}

function updateProgress() {
  const bar = $('#progress');
  bar.firstElementChild.style.width = (100 * P.filled.size / P.zones.length) + '%';
  bar.classList.toggle('full', P.filled.size === P.zones.length);
}

function fillZone(i) {
  const ci = P.colors[i];
  P.filled.add(i);
  paint(P.zones[i], P.d.palette[ci]);
  if (P.labelEls[i]) { P.labelEls[i].el.remove(); P.labelEls[i] = null; }
  store.set(P.d.key, [...P.filled]);
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* not allowed */ }
  P.left[ci]--;
  updateCount(ci);
  updateProgress();
  scheduleFindHint();
  if (P.left[ci] === 0) {
    P.swatches[ci].classList.add('done');
    const next = nextColor(ci);
    if (next >= 0) selectColor(next); else finish(true);
  }
}

function finish(celebrate) {
  P.sel = -1;
  P.swatches.forEach((b) => b.classList.remove('sel'));
  P.zones.forEach((z) => z.classList.remove('hl'));
  updateFindHint();
  $('#bravo').hidden = false;
  if (celebrate) confetti(P.d.palette);
}

// Index of the unfilled zone drawn under a screen point, or -1.
function hitZone(clientX, clientY) {
  const hit = document.elementFromPoint(clientX, clientY);
  if (!hit || !hit.hasAttribute || !hit.hasAttribute('data-i') || !P.art.contains(hit)) return -1;
  const i = parseInt(hit.getAttribute('data-i'), 10);
  return P.filled.has(i) ? -1 : i;
}

function tapAt(clientX, clientY) {
  if (P.sel < 0) return;
  const hit = hitZone(clientX, clientY);
  if (hit >= 0 && P.colors[hit] === P.sel) return fillZone(hit);
  const i = nearZone(clientX - P.left0, clientY - P.top0, P.sel);
  if (i >= 0) return fillZone(i);
  // wrong number: show which colour that zone wants, without any penalty
  if (hit >= 0) P.swatches[P.colors[hit]].classList.add('hint');
}

function longPress() {
  if (!P || !gest || !gest.tap) return;
  gest.tap = false;  // lifting the finger afterwards must not fill anything
  let i = hitZone(gest.lx, gest.ly);
  if (i < 0) i = nearZone(gest.lx - P.left0, gest.ly - P.top0, -1);
  if (i < 0) return;
  selectColor(P.colors[i]);
  P.swatches[P.colors[i]].classList.add('hint');
  try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) { /* not allowed */ }
}

// Nearest unfilled zone of colour `want` (any colour when -1) within reach of a stage point.
function nearZone(sx, sy, want) {
  const { k, W, H, lab } = P.info;
  const [vx, vy] = P.d.vb;
  const px = ((sx - P.tx) / P.s - vx) * k, py = ((sy - P.ty) / P.s - vy) * k;
  const R = TAP_REACH_PX / P.s * k;
  let best = -1, bestD = R * R;
  for (let y = Math.max(0, Math.floor(py - R)); y <= Math.min(H - 1, Math.ceil(py + R)); y++) {
    for (let x = Math.max(0, Math.floor(px - R)); x <= Math.min(W - 1, Math.ceil(px + R)); x++) {
      const L = lab[y * W + x];
      if (!L) continue;
      const i = L - 1;
      if (P.filled.has(i) || (want >= 0 && P.colors[i] !== want)) continue;
      const dd = (x + 0.5 - px) ** 2 + (y + 0.5 - py) ** 2;
      if (dd <= bestD) { bestD = dd; best = i; }
    }
  }
  return best;
}

function findZone() {
  if (!P || P.sel < 0) return;
  const cx = (P.W / 2 - P.tx) / P.s, cy = (P.H / 2 - P.ty) / P.s;
  let bi = -1, bd = Infinity;
  P.zones.forEach((z, i) => {
    if (P.filled.has(i) || P.colors[i] !== P.sel) return;
    const p = P.info.pos[i];
    const dd = (p.x - cx) ** 2 + (p.y - cy) ** 2;
    if (dd < bd) { bd = dd; bi = i; }
  });
  if (bi < 0) return;
  const p = P.info.pos[bi];
  const fs = P.labelEls[bi] ? P.labelEls[bi].fs : p.r;
  const s = clamp(26 / fs, P.s, P.fit * MAX_ZOOM);
  animateView(s, P.W / 2 - p.x * s, P.H / 2 - p.y * s, () => {
    const ring = svgEl('circle', { cx: fmt(p.x), cy: fmt(p.y), r: fmt(Math.max(p.r, 14 / P.s)), class: 'ring' });
    P.marks.append(ring);
    setTimeout(() => ring.remove(), 1900);
  });
}

function animateView(s1, tx1, ty1, done) {
  cancelAnimationFrame(P.anim);
  const s0 = P.s, tx0 = P.tx, ty0 = P.ty, t0 = performance.now(), dur = 380;
  const step = (now) => {
    if (!P) return;
    const t = Math.min(1, (now - t0) / dur);
    const e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
    setView(s0 + (s1 - s0) * e, tx0 + (tx1 - tx0) * e, ty0 + (ty1 - ty0) * e);
    if (t < 1) P.anim = requestAnimationFrame(step); else if (done) done();
  };
  P.anim = requestAnimationFrame(step);
}

// Touch: one finger taps or drags, two fingers pinch. A mouse wheel zooms on a computer.
const pointers = new Map();
let gest = null;

function pinchStart() {
  const [a, b] = [...pointers.values()];
  const mx = (a.x + b.x) / 2 - P.left0, my = (a.y + b.y) / 2 - P.top0;
  return { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: P.s, wx: (mx - P.tx) / P.s, wy: (my - P.ty) / P.s };
}

stage.addEventListener('pointerdown', (e) => {
  if (!P || e.target.closest('.bravo')) return;
  cancelAnimationFrame(P.anim);
  onStageResize();
  const r = stage.getBoundingClientRect();  // the stage can move without changing size
  P.left0 = r.left; P.top0 = r.top;
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    gest = { tap: true, x0: e.clientX, y0: e.clientY, t0: e.timeStamp, lx: e.clientX, ly: e.clientY, pinch: null,
      timer: setTimeout(longPress, LONG_PRESS_MS) };
  } else if (gest) {
    gest.tap = false;
    clearTimeout(gest.timer);
    gest.pinch = pinchStart();
  }
});

stage.addEventListener('pointermove', (e) => {
  if (!P || !gest || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    if (gest.tap && Math.hypot(e.clientX - gest.x0, e.clientY - gest.y0) > TAP_SLOP_PX) {
      gest.tap = false;
      clearTimeout(gest.timer);
    }
    if (!gest.tap) setView(P.s, P.tx + e.clientX - gest.lx, P.ty + e.clientY - gest.ly);
    gest.lx = e.clientX; gest.ly = e.clientY;
  } else if (gest.pinch) {
    const [a, b] = [...pointers.values()];
    const s = clamp(gest.pinch.s0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.pinch.d0, P.fit, P.fit * MAX_ZOOM);
    const mx = (a.x + b.x) / 2 - P.left0, my = (a.y + b.y) / 2 - P.top0;
    setView(s, mx - gest.pinch.wx * s, my - gest.pinch.wy * s);
  }
});

function pointerEnd(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (!P || !gest) return;
  clearTimeout(gest.timer);
  if (pointers.size === 0) {
    if (gest.tap && e.type === 'pointerup' && e.timeStamp - gest.t0 < 700) tapAt(e.clientX, e.clientY);
    gest = null;
  } else if (pointers.size === 1) {
    const [a] = pointers.values();
    gest.pinch = null; gest.lx = a.x; gest.ly = a.y;
  } else {
    gest.pinch = pinchStart();
  }
}
stage.addEventListener('pointerup', pointerEnd);
stage.addEventListener('pointercancel', pointerEnd);
stage.addEventListener('contextmenu', (e) => e.preventDefault());

stage.addEventListener('wheel', (e) => {
  if (!P) return;
  e.preventDefault();
  const s = clamp(P.s * Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)), P.fit, P.fit * MAX_ZOOM);
  const mx = e.clientX - P.left0, my = e.clientY - P.top0;
  const wx = (mx - P.tx) / P.s, wy = (my - P.ty) / P.s;
  setView(s, mx - wx * s, my - wy * s);
}, { passive: false });

// The drawing area changes size when the browser bars show or hide, or the phone turns:
// refit if the whole drawing was shown, else keep the same point in the middle.
function onStageResize() {
  if (!P) return;
  const r = stage.getBoundingClientRect();
  if (Math.abs(r.width - P.W) < 0.5 && Math.abs(r.height - P.H) < 0.5) return;
  const wasFit = P.s <= P.fit * 1.001;
  const cx = (P.W / 2 - P.tx) / P.s, cy = (P.H / 2 - P.ty) / P.s;
  measureStage();
  const [, , vw, vh] = P.d.vb;
  P.fit = Math.min(P.W / vw, P.H / vh) * 0.96;
  if (wasFit) fitView();
  else setView(P.s, P.W / 2 - cx * P.s, P.H / 2 - cy * P.s);
}
if (typeof ResizeObserver === 'function') new ResizeObserver(onStageResize).observe(stage);
addEventListener('resize', onStageResize);

let confettiRaf = 0;
function confetti(colors) {
  const c = $('#confetti');
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  c.hidden = false;
  const parts = Array.from({ length: 90 }, () => ({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6,
    vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
    a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3,
    w: 7 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  const frame = (now) => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
      ctx.restore();
    }
    if (now - t0 < 3500) confettiRaf = requestAnimationFrame(frame); else stopConfetti();
  };
  confettiRaf = requestAnimationFrame(frame);
}
function stopConfetti() {
  cancelAnimationFrame(confettiRaf);
  $('#confetti').hidden = true;
}

function goBack() {
  if (fromGallery) { fromGallery = false; history.back(); return; }
  history.replaceState(null, '', location.pathname + location.search);
  route();
}

$('#back').addEventListener('click', goBack);
$('#bravo-back').addEventListener('click', goBack);
$('#find').addEventListener('click', findZone);
$('#reset').addEventListener('click', () => { $('#confirm').hidden = false; });
$('#confirm-no').addEventListener('click', () => { $('#confirm').hidden = true; });
$('#confirm-yes').addEventListener('click', () => {
  $('#confirm').hidden = true;
  if (!P) return;
  store.set(P.d.key, []);
  openDrawing(P.d);
});

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const d = drawings.find((x) => x.id === id);
  if (d) openDrawing(d); else showGallery();
}
addEventListener('hashchange', route);
route();
</script>
